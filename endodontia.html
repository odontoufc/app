<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Endodontia | Guia Clínico - Odontologia</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class', // Habilita o modo escuro via classe CSS
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#0e7490', 
                        secondary: '#155e75', 
                        accent: '#ecfeff',
                        paper: '#ffffff',
                    },
                    screens: { 'xs': '375px' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./style.css">
    <meta name="description" content="Guia clínico de Endodontia: siglas, exemplos de prontuário, checklist de materiais e protocolos clínicos.">
</head>
<body data-page="endodontia" class="bg-gray-50 dark:bg-gray-900 dark:text-gray-100 text-gray-800 flex flex-col min-h-screen text-base antialiased transition-colors duration-200">

    <!-- Componentes comuns definidos nos arquivos de /components/. -->
    <site-header></site-header>

    <main class="flex-grow w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 pb-20">
        <nav aria-label="Navegação estrutural" class="mb-5 text-sm text-gray-500 dark:text-gray-400 flex items-center gap-2">
            <a href="./index.html" class="hover:text-primary dark:hover:text-cyan-400 transition-colors">Início</a>
            <i data-lucide="chevron-right" aria-hidden="true" class="w-4 h-4"></i>
            <span class="font-medium text-gray-700 dark:text-gray-200" aria-current="page">Endodontia</span>
        </nav>

        <div id="view-endodontia" class="view-section active space-y-4">
            <div class="flex items-center gap-3 mb-2 bg-white dark:bg-gray-800 dark:border-gray-700 p-3 rounded-lg shadow-sm border border-gray-100">
                <div class="p-2 bg-indigo-50 dark:bg-indigo-900/30 rounded-lg shrink-0"><i data-lucide="zap" class="w-6 h-6 text-indigo-600 dark:text-indigo-400"></i></div>
                <div><h2 class="text-xl font-bold text-gray-900 dark:text-white leading-tight">Endodontia</h2><p class="text-gray-500 dark:text-gray-400 text-xs">Prontuário e Materiais</p></div>
            </div>
            <div class="bg-white dark:bg-gray-800 dark:border-gray-700 rounded-xl shadow-sm border border-gray-200 flex overflow-x-auto scrollbar-hide">
                <button type="button" onclick="switchTab('prontuario', 'endodontia')" id="tab-btn-endodontia-prontuario" class="tab-btn tab-active-endodontia flex-1 py-3 px-4 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:text-indigo-600 transition-all flex items-center justify-center gap-2 whitespace-nowrap">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i> Prontuário
                </button>
                <button type="button" onclick="switchTab('instrumentais', 'endodontia')" id="tab-btn-endodontia-instrumentais" class="tab-btn flex-1 py-3 px-4 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:text-indigo-600 transition-all flex items-center justify-center gap-2 whitespace-nowrap">
                    <i data-lucide="hammer" class="w-4 h-4"></i> Materiais
                </button>
                 <button type="button" onclick="switchTab('protocolos', 'endodontia')" id="tab-btn-endodontia-protocolos" class="tab-btn flex-1 py-3 px-4 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:text-indigo-600 transition-all flex items-center justify-center gap-2 whitespace-nowrap">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Protocolos
                </button>
            </div>
            <div class="bg-white dark:bg-gray-800 dark:border-gray-700 rounded-xl shadow-sm border border-gray-200 p-4 sm:p-6 min-h-[400px] mt-2">
                <div id="tab-endodontia-prontuario" class="tab-content active">
                    <div id="prontuario-menu-endodontia" class="space-y-3">
                        <button type="button" onclick="showProntuarioSection('endodontia-siglas', 'endodontia')" class="w-full p-4 border border-gray-200 dark:border-gray-700 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 dark:hover:bg-gray-700 transition flex items-center gap-4 text-left">
                            <div class="p-3 bg-indigo-100 dark:bg-indigo-900/40 rounded-full text-indigo-600 dark:text-indigo-400 shrink-0"><i data-lucide="type" class="w-5 h-5"></i></div>
                            <div><span class="block font-semibold text-gray-800 dark:text-gray-200">Siglas</span><span class="text-xs text-gray-500 dark:text-gray-400">Abreviações de Endodontia</span></div>
                            <i data-lucide="chevron-right" class="ml-auto w-5 h-5 text-gray-300 dark:text-gray-600"></i>
                        </button>
                        <button type="button" onclick="showProntuarioSection('endodontia-exemplos', 'endodontia')" class="w-full p-4 border border-gray-200 dark:border-gray-700 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 dark:hover:bg-gray-700 transition flex items-center gap-4 text-left">
                            <div class="p-3 bg-indigo-100 dark:bg-indigo-900/40 rounded-full text-indigo-600 dark:text-indigo-400 shrink-0"><i data-lucide="file-check" class="w-5 h-5"></i></div>
                            <div><span class="block font-semibold text-gray-800 dark:text-gray-200">Exemplos</span><span class="text-xs text-gray-500 dark:text-gray-400">Preenchimento de canal</span></div>
                            <i data-lucide="chevron-right" class="ml-auto w-5 h-5 text-gray-300 dark:text-gray-600"></i>
                        </button>
                    </div>
                    <div id="dynamic-content-area-endodontia" class="hidden">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100 dark:border-gray-700">
                            <h3 id="dynamic-title-endodontia" class="font-bold text-lg text-gray-800 dark:text-white">Título</h3>
                            <button type="button" onclick="hideProntuarioSections('endodontia')" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 rounded-full text-xs text-gray-600 dark:text-gray-300 font-medium flex items-center gap-1 hover:bg-gray-200 dark:hover:bg-gray-600"><i data-lucide="arrow-left" class="w-3 h-3"></i> Voltar</button>
                        </div>
                        <div id="dynamic-body-endodontia" class="rich-text text-sm dark:text-gray-300"></div>
                    </div>
                </div>
                <div id="tab-endodontia-instrumentais" class="tab-content">
                    <h3 class="text-lg font-bold text-gray-800 dark:text-white flex items-center gap-2 mb-4"><i data-lucide="hammer" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i> Checklist Endodontia</h3>
                    <div id="instrumentais-list-endodontia" class="space-y-4 rich-text dark:text-gray-300"></div>
                </div>
                
                <div id="tab-endodontia-protocolos" class="tab-content">
                    <h3 class="text-lg font-bold text-gray-800 dark:text-white flex items-center gap-2 mb-4"><i data-lucide="book-open" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i> Protocolos de Endodontia</h3>
                    <div id="protocolos-list-endodontia" class="space-y-3">
                        <p class="text-center text-gray-500 dark:text-gray-400 py-4 text-sm">Nenhum protocolo de Endodontia cadastrado.</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-post" class="view-section">
            <div class="max-w-4xl mx-auto">
                <button type="button" onclick="navigateTo('endodontia')" class="mb-4 text-sm font-medium text-indigo-600 dark:text-indigo-400 inline-flex items-center gap-2 hover:underline">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar para Endodontia
                </button>
                <div class="bg-white dark:bg-gray-800 dark:border-gray-700 rounded-2xl shadow-sm border border-gray-200 overflow-hidden min-h-[60vh]">
                    <div class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-100 dark:border-gray-700 p-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <span id="post-category" class="inline-block px-2 py-1 rounded-md bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 text-xs font-bold uppercase mb-2">Categoria</span>
                                <h2 id="post-title" class="text-2xl font-bold text-gray-900 dark:text-white leading-tight">Título do Protocolo</h2>
                            </div>
                        </div>
                    </div>
                    <div id="post-content" class="p-5 sm:p-8 rich-text text-gray-700 dark:text-gray-200 leading-relaxed"></div>
                </div>
            </div>
        </div>

        <!-- Conteúdo fixo, independente dos cadastros de protocolos. -->
    </main>

    <site-footer></site-footer>

    <!-- Sem Firebase, autenticação, painel administrativo ou editor de protocolos. -->
    <!-- A ordem importa: banco de dados local antes da lógica compartilhada. -->
    <script src="./components/header-component.js" defer></script>
    <script src="./components/footer-component.js" defer></script>
    <script src="./banco_de_dados/endodontia.js" defer></script>
    <script src="./banco_de_dados/protocolos_endodontia.js" defer></script>
    <script src="./app.js" defer></script>
</body>
</html>
